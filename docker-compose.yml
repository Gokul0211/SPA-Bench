# ---------------------------------------------------------------------------
# SPABench — Docker Compose: 5 benchmark SPAs (13 containers) + 4 API servers
# ---------------------------------------------------------------------------
#
#   docker compose up -d --build
#   python sanity_check.py --manifest manifest.json          # live check
#   python sanity_check.py --manifest manifest.json --offline # no containers needed
#
# Host ports:
#   3001 angular-permit          3003 react-ecommerce      3005 nextjs-saas
#   3002 angular-erp (shell)     3004 vue-portal
#   3011-3018 angular-erp remotes (inventory, orders, users, reports,
#             finance, hr, crm, analytics)
#   4001 REST backend   4002 GraphQL backend   4003 WebSocket backend   4004 SOAP bridge
#
# Every app container is nginx listening on 80. Each app's nginx/*.conf forwards
# its same-origin API paths to the backends by service name on the compose
# network; the backends are also published directly for tools that call them.
#
# Authentication: every protected endpoint needs a real login
# (POST /api/auth/login, benchuser|benchadmin / benchpass; nextjs-saas adds TOTP).
# Set BENCH_ALLOW_STATIC_TOKEN=1 to also accept BENCH_BEARER_TOKEN — debugging
# only; benchmark runs must leave it at 0.

networks:
  spabench:
    driver: bridge

x-backend-env: &backend-env
  NODE_ENV: development
  BENCH_AUTH_SECRET: dev-secret-do-not-use-in-production
  BENCH_TOTP_SECRET: JBSWY3DPEHPK3PXP
  BENCH_BEARER_TOKEN: spabench-bearer-token-dev
  BENCH_ALLOW_STATIC_TOKEN: "0"

x-remote: &remote
  build: &remote-build
    context: ./apps/angular-erp
    dockerfile: Dockerfile
  networks: [spabench]

services:

  # ── API servers ───────────────────────────────────────────────────────────

  rest-backend:
    build: ./api-servers/rest-backend
    container_name: spabench-rest-backend
    networks: [spabench]
    ports: ["4001:4001"]
    environment:
      <<: *backend-env
      PORT: 4001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  graphql-backend:
    build: ./api-servers/graphql-backend
    container_name: spabench-graphql-backend
    networks: [spabench]
    ports: ["4002:4002"]
    environment:
      <<: *backend-env
      PORT: 4002
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  websocket-backend:
    build: ./api-servers/websocket-backend
    container_name: spabench-websocket-backend
    networks: [spabench]
    ports: ["4003:4003"]
    environment:
      <<: *backend-env
      PORT: 4003

  soap-bridge:
    build: ./api-servers/soap-bridge
    container_name: spabench-soap-bridge
    networks: [spabench]
    ports: ["4004:4004"]
    environment:
      <<: *backend-env
      PORT: 4004

  # ── App A — angular-permit ────────────────────────────────────────────────

  angular-permit:
    build: ./apps/angular-permit
    container_name: spabench-angular-permit
    networks: [spabench]
    ports: ["3001:80"]
    depends_on: [rest-backend]

  # ── App B — angular-erp (Module Federation shell + remotes) ───────────────

  angular-erp:
    build:
      <<: *remote-build
      target: shell
    container_name: spabench-angular-erp
    networks: [spabench]
    ports: ["3002:80"]
    depends_on: [rest-backend, mfe-inventory, mfe-orders, mfe-users, mfe-reports,
                 mfe-finance, mfe-hr, mfe-crm, mfe-analytics]

  mfe-inventory:
    <<: *remote
    build: {<<: *remote-build, target: mfe-inventory}
    container_name: spabench-mfe-inventory
    ports: ["3011:80"]

  mfe-orders:
    <<: *remote
    build: {<<: *remote-build, target: mfe-orders}
    container_name: spabench-mfe-orders
    ports: ["3012:80"]

  mfe-users:
    <<: *remote
    build: {<<: *remote-build, target: mfe-users}
    container_name: spabench-mfe-users
    ports: ["3013:80"]

  mfe-reports:
    <<: *remote
    build: {<<: *remote-build, target: mfe-reports}
    container_name: spabench-mfe-reports
    ports: ["3014:80"]

  mfe-finance:
    <<: *remote
    build: {<<: *remote-build, target: mfe-finance}
    container_name: spabench-mfe-finance
    ports: ["3015:80"]

  mfe-hr:
    <<: *remote
    build: {<<: *remote-build, target: mfe-hr}
    container_name: spabench-mfe-hr
    ports: ["3016:80"]

  mfe-crm:
    <<: *remote
    build: {<<: *remote-build, target: mfe-crm}
    container_name: spabench-mfe-crm
    ports: ["3017:80"]

  mfe-analytics:
    <<: *remote
    build: {<<: *remote-build, target: mfe-analytics}
    container_name: spabench-mfe-analytics
    ports: ["3018:80"]

  # ── App C — react-ecommerce ───────────────────────────────────────────────

  react-ecommerce:
    build: ./apps/react-ecommerce
    container_name: spabench-react-ecommerce
    networks: [spabench]
    ports: ["3003:80"]
    depends_on: [rest-backend]

  # ── App D — vue-portal ────────────────────────────────────────────────────

  vue-portal:
    build: ./apps/vue-portal
    container_name: spabench-vue-portal
    networks: [spabench]
    ports: ["3004:80"]
    depends_on: [rest-backend, soap-bridge]

  # ── App E — nextjs-saas ───────────────────────────────────────────────────

  nextjs-saas:
    build: ./apps/nextjs-saas
    container_name: spabench-nextjs-saas
    networks: [spabench]
    ports: ["3005:80"]
    depends_on: [rest-backend, graphql-backend, websocket-backend]
