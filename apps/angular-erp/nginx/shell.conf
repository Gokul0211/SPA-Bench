# angular-erp shell — published on host port 3002, listens on 80 in the container.
# Serves the shell at / and the co-hosted mfe-admin remote at /mfe-admin/.
# API and actuator calls go same-origin and are forwarded to the REST backend.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rest_backend http://rest-backend:4001;

    location ^~ /api/ {
        proxy_pass $rest_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /actuator {
        proxy_pass $rest_backend;
        proxy_set_header Host $host;
    }

    location ~* \.(?:js|mjs|map|css|json|ico|png|svg|txt)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","app":"angular-erp-shell"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
