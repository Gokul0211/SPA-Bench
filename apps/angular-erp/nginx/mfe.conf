# angular-erp micro-frontend remote (one container per remote, host ports 3011-3018,
# all listening on 80 in the container). Static files only; the shell loads each
# remote's remoteEntry.js cross-origin, so assets carry a permissive CORS header.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:js|mjs|map|css|json|ico|png|svg|txt)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","app":"angular-erp-remote"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
