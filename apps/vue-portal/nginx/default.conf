# vue-portal — published on host port 3004, listens on 80 in the container.
#
# Source maps are deliberately NOT served (every *.map request is a 404), the
# "restricted source maps" case. The SOAP bridge lives on its own service; every
# other /api/ path goes to the shared REST backend.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rest_backend http://rest-backend:4001;
    set $soap_bridge  http://soap-bridge:4004;

    location ^~ /api/legacy/bridge {
        proxy_pass $soap_bridge;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/ {
        proxy_pass $rest_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Must precede the static-asset rule: regex locations are tried in order.
    location ~* \.map$ {
        return 404;
    }

    location ~* \.(?:js|mjs|css|json|ico|png|svg|txt|wsdl)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","app":"vue-portal"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
