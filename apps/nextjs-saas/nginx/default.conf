# nextjs-saas — published on host port 3005, listens on 80 in the container.
#
# Same-origin routing, as a Next.js deployment behind one host would look:
#   /api/*    → shared REST backend
#   /graphql  → GraphQL backend (HTTP + graphql-ws subscriptions)
#   /ws/*     → WebSocket backend
# /_next/static/** and /dist/** are plain static files.

# Connection header for proxied WebSocket upgrades (http context).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rest_backend    http://rest-backend:4001;
    set $graphql_backend http://graphql-backend:4002;
    set $ws_backend      http://websocket-backend:4003;

    location ^~ /api/ {
        proxy_pass $rest_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /graphql {
        proxy_pass $graphql_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location ^~ /ws/ {
        proxy_pass $ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location ~* \.(?:js|mjs|map|css|json|ico|png|svg|txt)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","app":"nextjs-saas"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
