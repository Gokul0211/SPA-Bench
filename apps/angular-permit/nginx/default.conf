# angular-permit — published on host port 3001, listens on 80 in the container.
#
# The SPA calls the REST backend cross-origin (http://localhost:4001); same-origin
# /api/ requests (e.g. the HTML form) are forwarded to the same backend.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, resolved per request: nginx starts even when a
    # backend container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rest_backend http://rest-backend:4001;

    location ^~ /api/ {
        proxy_pass $rest_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static assets: the file itself or a real 404 — never the SPA shell.
    location ~* \.(?:js|mjs|map|css|json|ico|png|svg|txt|wsdl)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","app":"angular-permit"}';
    }

    # Client-side routes (/dashboard, /permits, ...) get the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
