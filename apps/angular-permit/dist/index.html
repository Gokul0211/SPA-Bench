<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Permit-to-Work</title>
  <base href="/">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <app-root></app-root>

  <form id="login-form" hidden>
    <label>Username <input name="username" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
    <p id="login-error" hidden>Invalid username or password.</p>
  </form>

  <!-- <script src="/permit-mobile-legacy.js"></script> -->

  <div ng-include="'/reports-module.js'" style="display:none" id="reports-preload"></div>

  <button id="admin-panel-loader" onclick="loadModule('/admin-module.js')" style="display:none" aria-hidden="true">Admin Panel</button>

  <form id="emergency-stop-form" method="POST" style="display:none">
    <button type="submit" formaction="/api/rc_permit/submitEmergencyStop" id="emergency-stop-btn">EMERGENCY STOP</button>
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (localStorage.getItem('ptw_role') === 'admin') {
        import('/admin-module.js').then(function (m) { if (m && m.initAdmin) m.initAdmin(); }).catch(function () {});
      }
    });
  </script>
  <script src="vendor.js" defer></script>
  <script src="bundle.js" defer></script>
</body>
</html>
