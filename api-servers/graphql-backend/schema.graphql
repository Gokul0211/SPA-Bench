# GraphQL schema of the nextjs-saas backend (graphql-backend:4002, reached
# same-origin at /graphql). Descriptions below are returned by introspection,
# so they describe the API only.

scalar DateTime

# ── Enums ────────────────────────────────────────────────────────────────────

"""
Order lifecycle status — used in listOrders filter and orderStatusChanged subscription.
"""
enum OrderStatus {
  PENDING
  PROCESSING
  SHIPPED
  DELIVERED
  CANCELLED
  REFUNDED
}

"""
Time granularity for dashboard metrics aggregation.
"""
enum Granularity {
  HOURLY
  DAILY
  WEEKLY
  MONTHLY
}

"""
Workspace member role — controls permissions and filters listTeamMembers.
"""
enum Role {
  OWNER
  ADMIN
  MEMBER
  VIEWER
}

"""
SaaS billing plan tiers.
"""
enum BillingPlan {
  FREE
  STARTER
  PRO
  ENTERPRISE
}

# ── Core Types ────────────────────────────────────────────────────────────────

type User {
  id: ID!
  email: String!
  username: String!
  fullName: String!
  role: Role!
  workspaceId: ID!
  createdAt: DateTime!
  lastLoginAt: DateTime
}

type LineItem {
  sku: String!
  quantity: Int!
  unitPrice: Float!
  total: Float!
}

type Order {
  id: ID!
  userId: ID!
  status: OrderStatus!
  lineItems: [LineItem!]!
  total: Float!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Review {
  reviewId: ID!
  rating: Int!
  comment: String!
  author: String!
  date: String!
}

type Product {
  id: ID!
  sku: String!
  name: String!
  category: String!
  price: Float!
  stock: Int!
  rating: Float!
  reviewCount: Int!
  description: String
  reviews: [Review!]
}

type MetricDataPoint {
  bucket: String!
  revenue: Float!
  users: Int!
}

type DashboardMetrics {
  period: String!
  granularity: Granularity
  totalRevenue: Float!
  activeUsers: Int!
  newSignups: Int!
  churnRate: Float!
  mrr: Float!
  conversionRate: Float!
  timeSeries: [MetricDataPoint!]!
  generatedAt: DateTime!
}

type AuditEntry {
  id: ID!
  resourceId: ID!
  action: String!
  performedBy: String!
  details: String
  timestamp: DateTime!
}

type TeamMember {
  id: ID!
  workspaceId: ID!
  userId: ID!
  email: String!
  fullName: String!
  role: Role!
  joinedAt: DateTime!
}

type BillingInfo {
  workspaceId: ID!
  plan: BillingPlan!
  status: String!
  currentPeriodStart: DateTime!
  currentPeriodEnd: DateTime!
  monthlyAmount: Float!
  seats: Int!
  usedSeats: Int!
}

type ActivityEvent {
  workspaceId: ID!
  userId: ID!
  action: String!
  resourceType: String!
  resourceId: ID!
  timestamp: DateTime!
}

# ── Input Types ───────────────────────────────────────────────────────────────

"""
Input for createUser mutation.
"""
input CreateUserInput {
  email: String!
  username: String!
  fullName: String!
  role: Role!
  workspaceId: ID!
}

"""
Input for updateOrder mutation.
"""
input UpdateOrderInput {
  status: OrderStatus
  lineItems: [LineItemInput!]
}

input LineItemInput {
  sku: String!
  quantity: Int!
  unitPrice: Float!
}

"""
Payment method input for processCheckout mutation.
"""
input PaymentInput {
  type: String!
  cardToken: String
  billingAddress: AddressInput
}

input AddressInput {
  line1: String!
  line2: String
  city: String!
  postalCode: String!
  country: String!
}

"""
Filter input for searchProducts query.
"""
input ProductFilter {
  category: String
  minPrice: Float
  maxPrice: Float
  inStock: Boolean
}

# ── Queries ───────────────────────────────────────────────────────────────────

type Query {
  """
  Fetch one user by id. Requires authentication.
  """
  getUser(id: ID!): User

  """
  List a user's orders, optionally filtered by status. Requires authentication.
  """
  listOrders(userId: ID!, status: OrderStatus, limit: Int): [Order!]!

  """
  Fetch one product, optionally with its reviews.
  """
  getProduct(id: ID!, includeReviews: Boolean): Product

  """
  Full-text product search with optional filters.
  """
  searchProducts(query: String!, filters: ProductFilter): [Product!]!

  """
  Workspace KPIs for a period. Requires authentication.
  """
  getDashboardMetrics(period: String!, granularity: Granularity): DashboardMetrics

  """
  Audit entries for a resource. Requires authentication.
  """
  getAuditLog(resourceId: ID!, from: DateTime, to: DateTime): [AuditEntry!]!

  """
  Members of a workspace. Requires authentication.
  """
  listTeamMembers(workspaceId: ID!, role: Role): [TeamMember!]!

  """
  Billing plan and seat usage of a workspace. Requires authentication.
  """
  getBillingInfo(workspaceId: ID!): BillingInfo
}

# ── Mutations ─────────────────────────────────────────────────────────────────

type Mutation {
  """
  Create a user. Requires authentication.
  """
  createUser(input: CreateUserInput!): User!

  """
  Update an order's status or line items. Requires authentication.
  """
  updateOrder(id: ID!, input: UpdateOrderInput!): Order!

  """
  Delete a product. Requires authentication.
  """
  deleteProduct(id: ID!): Boolean!

  """
  Turn a cart into an order. Requires authentication.
  """
  processCheckout(cartId: ID!, paymentMethod: PaymentInput!): Order!

  """
  Invite someone to a workspace. Requires authentication.
  """
  inviteTeamMember(workspaceId: ID!, email: String!, role: Role!): TeamMember!

  """
  Change a workspace's billing plan. Requires authentication.
  """
  updateBilling(workspaceId: ID!, plan: BillingPlan!): BillingInfo!
}

# ── Subscriptions ─────────────────────────────────────────────────────────────

type Subscription {
  """
  Order lifecycle events. Requires authentication.
  """
  orderStatusChanged(orderId: ID!): Order!

  """
  Refreshed workspace KPIs every 30 seconds. Requires authentication.
  """
  dashboardMetricsUpdated(workspaceId: ID!): DashboardMetrics!

  """
  Workspace activity stream. Requires authentication.
  """
  teamActivityFeed(workspaceId: ID!): ActivityEvent!
}
